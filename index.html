  <!--
    Hand-written. These were generated by vite-plugin-favicon, which emitted
    53 PNGs (14MB, mostly apple-touch-startup-images) and then wrote
    unresolved Rollup reference ids into their href attributes, so every one
    of them 404'd. theme-color lives here now for the same reason it used to
    live in the plugin config: the first one in <head> wins.
  -->
  <!--
    Hand-written rather than via unplugin-fonts, which scanned the whole bundle
    and emitted a preload for every font file it found -- including all four
    Material Design Icons formats, 3.3MB, where a browser uses exactly one.
    Three weights, not six: nothing on the site renders Roboto 100, 300 or 900.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"></noscript>

  <meta name="theme-color" content="#009688">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


</head>

<body>
